kind = "web"
previewPath = "/"
title = "App Store Screenshot Creator"
version = "1.0.0"
id = "artifacts/screenshot-editor"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21706

[services.development]
run = "pnpm --filter @workspace/screenshot-editor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/screenshot-editor", "run", "build" ]
publicDir = "artifacts/screenshot-editor/.next"
serve = "static"

[services.env]
PORT = "21706"
